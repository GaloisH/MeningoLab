name: 打包安装程序

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - "mlab/app.py"
      - "mlab/__main__.py"
      - "mlab/runtime.py"
      - "mlab/selftest.py"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Qt 运行所需的系统库
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        edition: [base, ai]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pyinstaller

      - name: 安装 PyTorch（CPU 版）与 nnU-Net
        if: matrix.edition == 'ai'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
          pip install nnunetv2
      - name: 生成用于自检的微型 nnU-Net 模型
        if: matrix.edition == 'ai'
        run: |
          MODEL=$(python scripts/make_dummy_nnunet_model.py "$RUNNER_TEMP/models" | tail -n 1)
          echo "SELFTEST_ARGS=--selftest-model $MODEL" >> "$GITHUB_ENV"

      - name: 下载 Inno Setup 简体中文语言文件
        if: runner.os == 'Windows'
        continue-on-error: true
        run: curl -fsSL -o packaging/ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl

      - name: 打包、自检并制作安装程序
        run: python packaging/build.py --edition ${{ matrix.edition }} $SELFTEST_ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: MLab-${{ matrix.os }}-${{ matrix.edition }}
          path: dist/installer/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
