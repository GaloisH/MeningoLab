name: 打包安装程序

on:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - "mlab/**"
      - "scripts/make_dummy_nnunet_model.py"
      - "pyproject.toml"
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/build.yml"
      - "mlab/app.py"
      - "mlab/__main__.py"
      - "mlab/runtime.py"
      - "mlab/selftest.py"
      - "pyproject.toml"

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Qt 运行所需的系统库
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # 基础版与 AI 版分成两个任务：Release 只依赖基础版，AI 版失败不会阻塞发布
  build-base:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pyinstaller
      - name: 下载 Inno Setup 简体中文语言文件
        if: runner.os == 'Windows'
        continue-on-error: true
        run: curl -fsSL -o packaging/ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl
      - name: 打包、自检并制作安装程序
        run: python packaging/build.py --edition base
      - uses: actions/upload-artifact@v4
        with:
          name: MLab-${{ matrix.os }}-base
          path: dist/installer/*
          if-no-files-found: error

  build-ai:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pyinstaller
      - name: 安装 PyTorch（CPU 版）与 nnU-Net
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
          pip install nnunetv2
      - name: 生成用于自检的微型 nnU-Net 模型
        run: |
          MODEL=$(python scripts/make_dummy_nnunet_model.py "$RUNNER_TEMP/models" | tail -n 1)
          echo "SELFTEST_MODEL=$MODEL" >> "$GITHUB_ENV"
      - name: 下载 Inno Setup 简体中文语言文件
        if: runner.os == 'Windows'
        continue-on-error: true
        run: curl -fsSL -o packaging/ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl
      - name: 打包、自检并制作安装程序
        run: python packaging/build.py --edition ai --selftest-model "$SELFTEST_MODEL"
      - uses: actions/upload-artifact@v4
        with:
          name: MLab-${{ matrix.os }}-ai
          path: dist/installer/*
          if-no-files-found: error

  # 推送 v* 标签发布；也可在分支提交信息中写 [release]，按 mlab/__init__.py 中的版本号自动打标签发布
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: MLab-*-base
          path: dist
          merge-multiple: true
      - name: 确定版本号
        id: ver
        run: echo "tag=v$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' mlab/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MLab ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          body_path: packaging/release_notes.md
          files: dist/*
